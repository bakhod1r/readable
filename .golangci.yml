# golangci-lint v2 configuration (matches the pinned version in CI and Makefile).
version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - copyloopvar
    - errcheck
    - errorlint
    - gocritic
    - godot
    - gosec
    - govet
    - ineffassign
    - intrange
    - misspell
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
  settings:
    godot:
      scope: declarations
    gosec:
      excludes:
        # G115 (integer overflow on conversion) reports every int64<->uint64
        # conversion. This package converts only after explicit sign/range
        # handling, which the rule cannot see.
        - G115
    govet:
      disable:
        # Struct layout is chosen for readability.
        - fieldalignment
      enable-all: true
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: receiver-naming
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bakhod1r/readable
  exclusions:
    generated: lax
