title: readable
description: Turn raw values into clean human-readable strings — numbers, bytes, time, money, lists, logs and masked secrets. Zero dependencies.
url: https://bakhod1r.github.io
baseurl: /readable

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: dark
search_enabled: true
search:
  heading_level: 3
  previews: 2

heading_anchors: true

# Extensionless URLs (/money/), which the in-page cross links rely on.
permalink: pretty

aux_links:
  GitHub: https://github.com/bakhod1r/readable
  pkg.go.dev: https://pkg.go.dev/github.com/bakhod1r/readable
aux_links_new_tab: true

footer_content: 'MIT © <a href="https://github.com/bakhod1r">bakhod1r</a>'

exclude:
  - vendor
